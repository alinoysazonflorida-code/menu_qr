    <meta charset="utf-8">

    <title>Aliño y Sazón - Menú Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1546473138-164b711e51b6?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .cactus-icon {
            display: inline-block;
            width: 20px;
            height: 30px;
            background-color: #34D399; /* Green-400 */
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            position: relative;
            transform: rotate(10deg);
        }
        .cactus-icon::before, .cactus-icon::after {
            content: '';
            position: absolute;
            background-color: #34D399;
            width: 10px;
            height: 20px;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            top: 5px;
        }
        .cactus-icon::before {
            left: -8px;
            transform: rotate(-30deg);
        }
        .cactus-icon::after {
            right: -8px;
            transform: rotate(30deg);
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #34D399; /* Green-400 */
        }
        input:focus + .slider {
            box-shadow: 0 0 1px #34D399;
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(16px);
            -ms-transform: translateX(16px);
            transform: translateX(16px);
        }
    </style>
</head>

        let menuItems = [];
        let dailySelections = {
            principios: [],
            sopa: null
        };

        function initializeMenu() {
            menuItems = rawMenuItemsData.map((item, index) => ({
                ...item,
                id: `item-${index}`,
                isActive: true
            }));

            const savedMenuItems = localStorage.getItem('menuItems');
            const savedDailySelections = localStorage.getItem('dailySelections');

            if (savedMenuItems) {
                const parsedSavedMenuItems = JSON.parse(savedMenuItems);
                menuItems = menuItems.map(item => {
                    const savedItem = parsedSavedMenuItems.find(sItem => sItem.id === item.id);
                    return savedItem ? { ...item, isActive: savedItem.isActive } : item;
                });
            }

            if (savedDailySelections) {
                dailySelections = JSON.parse(savedDailySelections);
            }
        }

        function saveState() {
            localStorage.setItem('menuItems', JSON.stringify(menuItems));
            localStorage.setItem('dailySelections', JSON.stringify(dailySelections));
        }

        const formatter = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0,
        });

        function formatPrice(price) {
            return price === 0 ? '' : formatter.format(price);
        }

        function renderCustomerMenu() {
            const platosCorrientesList = document.getElementById('platosCorrientesList');
            const platosEspecialesList = document.getElementById('platosEspecialesList');
            const adicionalesList = document.getElementById('adicionalesList');
            const bebidasList = document.getElementById('bebidasList');

            platosCorrientesList.innerHTML = '';
            platosEspecialesList.innerHTML = '';
            adicionalesList.innerHTML = '';
            bebidasList.innerHTML = '';

            const activeItems = menuItems.filter(item => item.isActive);

            // Platos Corrientes: Principios, Sopa, Corrientes
            const dailyPrincipios = activeItems.filter(item => dailySelections.principios.includes(item.id));
            const dailySopa = activeItems.find(item => item.id === dailySelections.sopa);
            const corrientesItems = activeItems.filter(item => item.category === 'corrientes');

            if (dailyPrincipios.length > 0) {
                platosCorrientesList.innerHTML += `<p class="text-orange-300 font-semibold mb-2">Principios:</p>`;
                dailyPrincipios.forEach(item => {
                    platosCorrientesList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${item.name}</span><span class="text-orange-400">${formatPrice(item.price)}</span></div>`;
                });
            } else {
                platosCorrientesList.innerHTML += `<p class="text-orange-400">No hay principios seleccionados para hoy.</p>`;
            }

            if (dailySopa) {
                platosCorrientesList.innerHTML += `<p class="text-orange-300 font-semibold mt-4 mb-2">Sopa:</p>`;
                platosCorrientesList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${dailySopa.name}</span><span class="text-orange-400">${formatPrice(dailySopa.price)}</span></div>`;
            } else {
                platosCorrientesList.innerHTML += `<p class="text-orange-400">No hay sopa seleccionada para hoy.</p>`;
            }
            
            if (corrientesItems.length > 0) {
                platosCorrientesList.innerHTML += `<p class="text-orange-300 font-semibold mt-4 mb-2">Platos Principales:</p>`;
                corrientesItems.forEach(item => {
                    platosCorrientesList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${item.name}</span><span class="text-orange-400">${formatPrice(item.price)}</span></div>`;
                });
            } else {
                platosCorrientesList.innerHTML += `<p class="text-orange-400">No hay platos corrientes activos.</p>`;
            }

            // Platos Especiales: especiales del dia + especiales
            const especialesItems = activeItems.filter(item => 
                item.category === 'especiales del dia' || item.category === 'especiales'
            );
            if (especialesItems.length > 0) {
                especialesItems.forEach(item => {
                    platosEspecialesList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${item.name}</span><span class="text-orange-400">${formatPrice(item.price)}</span></div>`;
                });
            } else {
                platosEspecialesList.innerHTML += `<p class="text-orange-400">No hay platos especiales activos.</p>`;
            }

            // Adicionales
            const adicionalesItems = activeItems.filter(item => item.category === 'adicionales');
            if (adicionalesItems.length > 0) {
                adicionalesItems.forEach(item => {
                    adicionalesList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${item.name}</span><span class="text-orange-400">${formatPrice(item.price)}</span></div>`;
                });
            } else {
                adicionalesList.innerHTML += `<p class="text-orange-400">No hay adicionales activos.</p>`;
            }

            // Bebidas
            const bebidasItems = activeItems.filter(item => item.category === 'bebidas');
            if (bebidasItems.length > 0) {
                bebidasItems.forEach(item => {
                    bebidasList.innerHTML += `<div class="flex justify-between items-center text-lg"><span>${item.name}</span><span class="text-orange-400">${formatPrice(item.price)}</span></div>`;
                });
            } else {
                bebidasList.innerHTML += `<p class="text-orange-400">No hay bebidas activas.</p>`;
            }
        }

        function renderAdminPanel() {
            const adminPrincipiosSelection = document.getElementById('adminPrincipiosSelection');
            const adminSopasSelection = document.getElementById('adminSopasSelection');
            const adminAllItemsList = document.getElementById('adminAllItemsList');

            adminPrincipiosSelection.innerHTML = '';
            adminSopasSelection.innerHTML = '';
            adminAllItemsList.innerHTML = '';

            // Render Principios selection
            const principios = menuItems.filter(item => item.category === 'principio');
            principios.forEach(item => {
                const isChecked = dailySelections.principios.includes(item.id);
                adminPrincipiosSelection.innerHTML += `
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" data-item-id="${item.id}" class="form-checkbox h-5 w-5 text-green-600 bg-red-700 border-red-500 rounded focus:ring-green-500" ${isChecked ? 'checked' : ''} onchange="handlePrincipioSelection(this)">
                        <span class="ml-2 text-green-100">${item.name}</span>
                    </label>
                `;
            });

            // Render Sopas selection
            const sopas = menuItems.filter(item => item.category === 'sopas');
            sopas.forEach(item => {
                const isChecked = dailySelections.sopa === item.id;
                adminSopasSelection.innerHTML += `
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="dailySopa" data-item-id="${item.id}" class="form-radio h-5 w-5 text-green-600 bg-red-700 border-red-500 focus:ring-green-500" ${isChecked ? 'checked' : ''} onchange="handleSopaSelection(this)">
                        <span class="ml-2 text-green-100">${item.name}</span>
                    </label>
                `;
            });

            // Render all items with active/deactive toggles, grouped by original category
            const categories = [...new Set(menuItems.map(item => item.category))];
            categories.forEach(category => {
                const categoryItems = menuItems.filter(item => item.category === category);
                adminAllItemsList.innerHTML += `<h4 class="text-xl font-semibold text-green-300 mt-6 mb-3">${category.charAt(0).toUpperCase() + category.slice(1)}</h4>`;
                categoryItems.forEach(item => {
                    adminAllItemsList.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-red-700 rounded-md">
                            <span class="text-green-100">${item.name} <span class="text-green-300 text-sm">(${formatPrice(item.price)})</span></span>
                            <label class="toggle-switch">
                                <input type="checkbox" data-item-id="${item.id}" ${item.isActive ? 'checked' : ''} onchange="toggleItemActive(this)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                });
            });
        }

        function handlePrincipioSelection(checkbox) {
            const itemId = checkbox.dataset.itemId;
            if (checkbox.checked) {
                if (dailySelections.principios.length < 2) {
                    dailySelections.principios.push(itemId);
                } else {
                    checkbox.checked = false; 
                    alert('Solo puedes seleccionar hasta 2 principios.');
                }
            } else {
                dailySelections.principios = dailySelections.principios.filter(id => id !== itemId);
            }
            saveState();
            renderCustomerMenu();
        }

        function handleSopaSelection(radio) {
            const itemId = radio.dataset.itemId;
            if (radio.checked) {
                dailySelections.sopa = itemId;
            } else {
                dailySelections.sopa = null; 
            }
            saveState();
            renderCustomerMenu();
        }

        function toggleItemActive(checkbox) {
            const itemId = checkbox.dataset.itemId;
            const item = menuItems.find(i => i.id === itemId);
            if (item) {
                item.isActive = checkbox.checked;
                saveState();
                renderCustomerMenu();
            }
        }

        function showView(viewId) {
            document.getElementById('customerView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeMenu();
            renderCustomerMenu();
            renderAdminPanel();
            showView('customerView');

            const showCustomerBtn = document.getElementById('showCustomerBtn');
            const showAdminBtn = document.getElementById('showAdminBtn');
            const adminLoginContainer = document.getElementById('adminLoginContainer');
            const passwordPrompt = document.getElementById('passwordPrompt');
            const adminPasswordInput = document.getElementById('adminPassword');
            const submitPasswordBtn = document.getElementById('submitPasswordBtn');

            const ADMIN_PASSWORD = 'fabniño'; // Contraseña simple para el acceso de administrador

            showCustomerBtn.addEventListener('click', () => showView('customerView'));
            showAdminBtn.addEventListener('click', () => showView('adminView'));

            adminLoginContainer.addEventListener('click', () => {
                passwordPrompt.classList.toggle('hidden');
                if (!passwordPrompt.classList.contains('hidden')) {
                    adminPasswordInput.focus();
                }
            });

            submitPasswordBtn.addEventListener('click', () => {
                if (adminPasswordInput.value === ADMIN_PASSWORD) {
                    showAdminBtn.classList.remove('hidden');
                    passwordPrompt.classList.add('hidden');
                    adminPasswordInput.value = ''; // Limpiar contraseña
                    alert('Acceso de administrador concedido.');
                } else {
                    alert('Contraseña incorrecta.');
                    adminPasswordInput.value = ''; // Limpiar contraseña
                }
            });

            adminPasswordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitPasswordBtn.click();
                }
            });
        });
    </script>
</body>
</html>
